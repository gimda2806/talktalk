# main 에 푸시되면 설렘 모먼트 뷰어를 빌드해 Cloudflare Workers 로 배포한다.
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: 뷰어 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-viewer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 비밀값 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::저장소 Settings → Secrets and variables → Actions 에 비밀값을 추가하세요:$missing"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 뷰어 빌드
        run: python3 viewer/build.py

      - name: Cloudflare 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
